window.BLINGO_CONFIG=window.BLINGO_CONFIG||{aiEndpoint:""};
/* Lớp tương thích: app gọi claude.use("downloads") và claude.use("sample"). Ngoài môi trường Claude, hai chức năng này được thay như sau. */
(function(){if(window.claude)return;var C=window.BLINGO_CONFIG||{};
window.claude={use:async function(n){
 if(n==="downloads")return{save:async function(o){var d=o.data,b=new Blob([typeof d==="string"?d:(d instanceof Uint8Array?d:new Uint8Array(d))],{type:o.type||"application/octet-stream"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=o.filename||"file";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}};

<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

{const u=AUTH.u.find(x=>x.id==AUTH.s);if(u)loadUser(u)}

 const ident=normId(val("au_id")),pw=val("au_pw");AUE="";AUOK="";

 AUFAIL=0;AUTH.s=u.id;saveAuth();loadUser(u);view="home";render()
 }catch(x){AUE="Có lỗi khi xử lý: "+x.message;render()}

async function changePw(){

 }catch(x){AUE="Có lỗi: "+x.message}

}

/* ===== Xuất đề ra Word ===== */
const xe=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function dRuns(t,b,u,c){return String(t).split(/(\*\*[\s\S]+?\*\*|<u>[\s\S]+?<\/u>)/).filter(Boolean).map(p=>{
 if(/^\*\*[\s\S]+\*\*$/.test(p))return dRuns(p.slice(2,-2),1,u,c);
 if(/^<u>[\s\S]+<\/u>$/.test(p))return dRuns(p.slice(3,-4),b,1,c);
 return `<w:r><w:rPr>${b?"<w:b/>":""}${c?`<w:color w:val="${c}"/>`:""}${u?'<w:u w:val="single"/>':""}</w:rPr><w:t xml:space="preserve">${xe(p.replace(/\*\*|<\/?u>/g,""))}</w:t></w:r>`}).join("")}
function dP(t,o={}){return `<w:p><w:pPr>${o.keep?"<w:keepNext/>":""}<w:spacing w:before="${o.bf||0}" w:after="${o.af??60}"/>${o.ind?`<w:ind w:left="${o.ind}"/>`:""}${o.c?'<w:jc w:val="center"/>':""}</w:pPr>${t===""?"":dRuns(t,o.b,0,o.col)}</w:p>`}
function dTbl(rows){const bd=["top","left","bottom","right","insideH","insideV"].map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="808080"/>`).join("");
 return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:jc w:val="center"/><w:tblBorders>${bd}</w:tblBorders></w:tblPr>${rows.map((r,ri)=>`<w:tr>${r.map(c=>`<w:tc><w:tcPr><w:tcW w:w="800" w:type="dxa"/>${ri%2==0?'<w:shd w:val="clear" w:color="auto" w:fill="EEEEEE"/>':""}</w:tcPr>${dP(String(c),{c:1,af:20,b:ri%2==0})}</w:tc>`).join("")}</w:tr>`).join("")}</w:tbl>`}
async function buildDocx(e,withAns){
 if(!window.JSZip)await loadJS(JSZ);
 const qs=e.qs,n=qs.length,B=blocks(qs),min=n==40?50:Math.max(5,Math.round(n*1.25));let x="";
 x+=dP(e.title,{c:1,b:1,af:60})+dP(`Thời gian làm bài: ${min} phút – Số câu: ${n}${withAns?" – (Bản có đáp án)":""}`,{c:1,af:60})+dP("Họ và tên: ................................................   Lớp: ...............   Điểm: ..........",{c:1,af:160});
 let prev="";
 B.forEach(b=>{const lo=b.items[0].n,hi=b.items[b.items.length-1].n,first=b.items[0].q,kind=first.p?"p":first.q.includes("\n")?"a":"m";
  if(kind=="p")x+=dP(`Read the following text and mark the letter A, B, C or D on your answer sheet to indicate the correct answer to each of the questions from ${lo} to ${hi}.`,{b:1,bf:140,keep:1})+b.left.split("\n").map(l=>dP(l,{af:40})).join("");
  else if(kind=="a"){if(prev!="a")x+=dP("Mark the letter A, B, C or D on your answer sheet to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text in each of the following questions.",{b:1,bf:140,keep:1})}
  else x+=dP("Mark the letter A, B, C or D on your answer sheet to indicate the correct answer to each of the following questions.",{b:1,bf:140,keep:1});
  prev=kind;
  b.items.forEach(({q,n:k})=>{
   const lines=q.q.split("\n"),blankOnly=/^\(\d+\) _+$/.test(lines[0])||/^Chọn câu phù hợp/.test(lines[0]);
   if(kind=="a")x+=dP(`Question ${k}.`,{b:1,bf:100,keep:1})+lines.map(l=>dP(l,{ind:360,af:20,keep:1})).join("");
   else if(blankOnly)x+=dP(`Question ${k}.`,{b:1,bf:100,keep:1});
   else x+=dP(`**Question ${k}.** ${lines[0]}`,{bf:100,keep:1})+lines.slice(1).map(l=>dP(l,{ind:360,af:20,keep:1})).join("");
   q.o.forEach((o,i)=>{const ok=withAns&&i==q.a;x+=dP(`${"ABCD"[i]}. ${o}`,{ind:360,af:20,col:ok?"FF0000":"",b:ok})})})});
 if(withAns){const rows=[];for(let s=0;s<n;s+=10){const r=qs.slice(s,s+10);rows.push(r.map((_,i)=>s+i+1));rows.push(r.map(q=>"ABCD"[q.a]))}
  x+=dP("ĐÁP ÁN",{c:1,b:1,bf:300,af:100,keep:1})+dTbl(rows)}
 x+=dP("--- HẾT ---",{c:1,bf:240});
 const ns='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"',H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 const z=new JSZip();
 z.file("[Content_Types].xml",H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
 z.file("_rels/.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 z.file("word/_rels/document.xml.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
 z.file("word/styles.xml",H+`<w:styles ${ns}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="en-US" w:eastAsia="vi-VN" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="60" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`);
 z.file("word/document.xml",H+`<w:document ${ns}><w:body>${x}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`);
 return z.generateAsync({type:"uint8array",compression:"DEFLATE"})
}
async function exportDocx(e,withAns){

  const nm=String(e.title||"de-thi").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[đĐ]/g,"d").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50)||"de-thi";

}

let CD="",CT="st",CDX="",CDRM=-1;
const nn=s=>String(s||"").normalize("NFC").trim().replace(/\s+/g," ").toLowerCase();
const cAsg=c=>S.a.filter(a=>a.cid==c.id);
const bestSub=(a,name)=>{const L=a.subs.filter(s=>nn(s.name)==nn(name));return L.length?L.reduce((x,y)=>y.sc>x.sc?y:x):null};
const r1=v=>Math.round(v*10)/10;
const mean=a=>a.length?r1(a.reduce((x,y)=>x+y,0)/a.length):null;
const stuAvg=(c,n)=>mean(cAsg(c).map(a=>bestSub(a,n)).filter(Boolean).map(b=>b.sc));
const rank=v=>v==null||v===""?"":v>=8?"Giỏi":v>=6.5?"Khá":v>=5?"Trung bình":"Yếu";
function cStats(c){const A=cAsg(c),sc=[];let sub=0;c.st.forEach(n=>A.forEach(a=>{const b=bestSub(a,n);if(b){sc.push(b.sc);sub++}}));return{A,open:A.filter(a=>!aClosed(a)).length,avg:mean(sc),rate:A.length&&c.st.length?Math.round(sub/(A.length*c.st.length)*100):null}}
const cTitle=a=>a.title||(ex(a.eid)||{}).title||"(đề đã xóa)";
function cdet(){

 const st=cStats(c),A=st.A,ex2=[...new Set(A.flatMap(a=>a.subs.map(s=>s.name)).filter(n=>!c.st.some(x=>nn(x)==nn(n))))];

 const tabs=[["st","Học sinh ("+c.st.length+")"],["as","Bài giao ("+A.length+")"],["sc","Bảng điểm"]];
 let body="";
 if(CT=="st")body=`<div class="card"><div class="row"><input id="cd_n" placeholder="Họ và tên học sinh mới" style="flex:1;min-width:200px"><button class="btn" data-act="cAddS">+ Thêm học sinh</button></div>
  ${c.st.length?`<div style="overflow:auto;margin-top:10px"><table><tr><th>STT</th><th>Mã HS</th><th>Họ và tên</th><th>Ngày sinh</th><th>SĐT</th><th>Đã nộp</th><th>Điểm TB</th><th></th></tr>${c.st.map((n,i)=>{const f=(c.info||{})[n]||{},got=A.filter(a=>bestSub(a,n)).length,av=stuAvg(c,n);return `<tr><td>${i+1}</td><td>${esc(f.code)}</td><td>${esc(n)}</td><td>${esc(f.dob)}</td><td>${esc(f.phone)}</td><td>${got}/${A.length}</td><td>${av==null?"–":av}</td><td>${CDRM===i?`<button class="btn d s" data-act="cRm2" data-i="${i}">Xác nhận xóa</button> <button class="btn o s" data-act="cRm0">Hủy</button>`:`<button class="btn o s" data-act="cRm" data-i="${i}">Xóa</button>`}</td></tr>`}).join("")}</table></div>`:`<div class="empty">Lớp chưa có học sinh. Thêm từng em ở trên hoặc tạo lại lớp từ file Excel.</div>`}</div>`;
 if(CT=="as")body=A.length?[...A].reverse().map(a=>{const s=aStatus(a),open=CDX==a.id,done=c.st.filter(n=>bestSub(a,n)),miss=c.st.filter(n=>!bestSub(a,n)),av=mean(done.map(n=>bestSub(a,n).sc));

  ${open?`<div class="grid" style="margin-top:10px;align-items:start"><div><b>Đã nộp (${done.length})</b>${done.length?`<table>${done.map(n=>{const b=bestSub(a,n);return `<tr><td>${esc(n)}</td><td>${dsc(a,b)}/${SC(a)}</td></tr>`}).join("")}</table>`:`<div class="mute small">Chưa có ai.</div>`}</div><div><b>Chưa nộp (${miss.length})</b>${miss.length?`<div class="small" style="margin-top:6px">${miss.map(esc).join(", ")}</div>`:`<div class="mute small">Cả lớp đã nộp.</div>`}</div></div>`:""}</div>`}).join(""):`<div class="card empty">Lớp chưa được giao bài nào.<br><br><button class="btn" data-act="cAssign">Giao bài cho lớp này</button></div>`;
 if(CT=="sc")body=A.length&&c.st.length?`<div class="card" style="overflow:auto"><table><tr><th>STT</th><th>Họ và tên</th>${A.map(a=>`<th title="${esc(cTitle(a))}">${esc(cTitle(a).slice(0,18))}<div class="small mute">/${SC(a)}</div></th>`).join("")}<th>TB (/10)</th><th>Xếp loại</th></tr>${c.st.map((n,i)=>{const av=stuAvg(c,n);return `<tr><td>${i+1}</td><td>${esc(n)}</td>${A.map(a=>{const b=bestSub(a,n);if(!b)return `<td class="mute">–</td>`;const pass=a.set?b.n?b.cor/b.n*100>=+a.set.pass:true:true;return `<td style="${pass?"":"color:var(--bad);font-weight:600"}">${dsc(a,b)}</td>`}).join("")}<td><b>${av==null?"–":av}</b></td><td>${rank(av)}</td></tr>`}).join("")}</table>${ex2.length?`<p class="small mute">Có ${ex2.length} bài nộp có tên không khớp danh sách lớp (${ex2.map(esc).join(", ")}). Các bài này chỉ có trong file Excel xuất ra.</p>`:""}<p class="small mute">Điểm lấy lần làm cao nhất của mỗi bài. Màu đỏ: dưới mức đạt của bài. Xếp loại tham khảo: Giỏi từ 8, Khá từ 6.5, Trung bình từ 5.</p></div>`:`<div class="card empty">Cần có học sinh và ít nhất một bài giao để xem bảng điểm.</div>`;
 return `<div class="row sb" style="margin-bottom:6px"><div><button class="btn o s" data-go="classes">← Danh sách lớp</button><h1 style="margin-top:8px">${esc(c.n)} <span class="tag b">Khối ${c.g}</span></h1></div><div class="row"><button class="btn" data-act="cAssign">Giao bài cho lớp này</button><button class="btn o" data-act="xGrades" data-id="${c.id}">Xuất điểm ra Excel</button></div></div>${stats}

}
