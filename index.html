async function bad(r){var st=r.status,d="";try{d=(await r.text()).slice(0,200).replace(/\s+/g," ")}catch(e){}if(st===429)throw{code:"rate_limited",status:st,detail:d};if(st===400||st===401||st===403)throw{code:"not_granted",status:st,detail:d};throw{code:"error",status:st,detail:d}}

async function viaGemini(prompt){
  const cfg = window.BLINGO_CONFIG || {};
  if (cfg.aiEndpoint) {
    if (!auth || !auth.currentUser) {
      throw { code: "not_granted", detail: "Vui lòng đăng nhập tài khoản giáo viên để sử dụng tính năng AI." };
    }
    const token = await auth.currentUser.getIdToken();
    let r;
    try {
      r = await fetch(cfg.aiEndpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ prompt: prompt })
      });
    } catch (e) {
      throw { code: "network", detail: "Không thể kết nối máy chủ AI." };
    }
    if (!r.ok) {
      let d = "";
      try {
        const j = await r.json();
        d = j.error || j.detail || "";
      } catch (e) {
        try { d = (await r.text()).slice(0, 200); } catch (e2) {}
      }
      if (r.status === 429) throw { code: "rate_limited", status: 429, detail: d || "Quá giới hạn tần suất yêu cầu AI (30 yêu cầu/phút hoặc 800 yêu cầu/ngày)." };
      if (r.status === 400 || r.status === 401 || r.status === 403) throw { code: "not_granted", status: r.status, detail: d || "Quyền truy cập AI không hợp lệ." };
      throw { code: "error", status: r.status, detail: d || ("Lỗi máy chủ AI (" + r.status + ")") };
    }
    const j = await r.json();
    return {
      text: j.text || "",
      truncated: !!j.truncated
    };
  }

  var k=aiKey();if(!k)throw{code:"not_granted",detail:"Chưa cấu hình API Key."};var r;
  var mdl = (function(){try{return localStorage.getItem("blingo_ai_model")}catch(e){return ""}})() || "gemini-flash-latest";
  try{r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+mdl+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":k},body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:24000,temperature:0.7}})})}catch(e){throw{code:"network"}}
  if(!r.ok)await bad(r);var j=await r.json(),c=j.candidates&&j.candidates[0];if(!c||!c.content)throw{code:"error",detail:"Gemini không trả nội dung"+(c&&c.finishReason?" ("+c.finishReason+")":"")};
  return{text:(c.content.parts||[]).map(function(p){return p.text||""}).join(""),truncated:c.finishReason==="MAX_TOKENS"};
}

window.claude = {
  use: async function(n){
    if(n==="downloads") return {
      save: async function(o){
        var d=o.data,b=new Blob([typeof d==="string"?d:(d instanceof Uint8Array?d:new Uint8Array(d))],{type:o.type||"application/octet-stream"});
        var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=o.filename||"file";
        document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
      }
    };
    if(n==="sample"){
      if(hasAiAccess()) return function(p){return viaGemini(p)};
    }
    return null;
  }
};

/* Save state to Firestore under users/{uid} */
function save() {
  if (!ME) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const uref = doc(db, "users", ME.uid);
      await setDoc(uref, {
        me: S.me || ME.displayName || ME.email || "thầy/cô",
        email: ME.email || "",
        c: S.c || [],
        e: S.e || [],
        a: S.a || [],
        t: S.t || [],
        th: S.th || "",
        sp: S.sp || [],
        tpp: S.tpp || {},
        updatedAt: Date.now()
      }, { merge: true });
    } catch (err) {
      console.error("Firestore sync error:", err);
    }
  }, 300);
}

async function doAuth(mode) {
  const email = val("au_id").trim();
  const pw = val("au_pw");
  AUE = ""; AUOK = "";

  if (mode === "fp") {
    if (!email || !email.includes("@")) {
      AUE = "Vui lòng nhập địa chỉ email hợp lệ để nhận liên kết khôi phục mật khẩu.";
      return render();
    }
    try {
      await sendPasswordResetEmail(auth, email);
      AUOK = "Đã gửi email khôi phục mật khẩu. Vui lòng kiểm tra hộp thư (cả mục Spam).";
      AUM = "in";
      render();
    } catch (x) {
      AUE = "Lỗi gửi email: " + (x.code === "auth/user-not-found" ? "Không tìm thấy tài khoản với email này." : x.message);
      render();
    }
    return;
  }

  if (!email || !email.includes("@")) {
    AUE = "Vui lòng nhập địa chỉ email chính xác.";
    return render();
  }
  if (!pw || pw.length < 6) {
    AUE = "Mật khẩu phải có tối thiểu 6 ký tự.";
    return render();
  }

  try {
    if (mode === "up") {
      const nm = val("au_nm").trim();
      const pw2 = val("au_pw2");
      if (!nm) { AUE = "Vui lòng nhập họ và tên giáo viên."; return render(); }
      if (pw !== pw2) { AUE = "Hai mật khẩu chưa trùng khớp."; return render(); }

      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      if (cred.user) {
        await updateProfile(cred.user, { displayName: nm });
        S.me = nm;
      }
      AUOK = "Tạo tài khoản thành công!";
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
    }
  } catch (x) {
    console.error(x);
    if (x.code === "auth/user-not-found" || x.code === "auth/wrong-password" || x.code === "auth/invalid-credential") {
      AUE = "Email hoặc mật khẩu chưa chính xác.";
    } else if (x.code === "auth/email-already-in-use") {
      AUE = "Email này đã được đăng ký tài khoản. Vui lòng chọn Đăng nhập.";
    } else {
      AUE = "Lỗi xác thực: " + (x.message || x.code);
    }
    render();
  }
}

async function doLogout() {

  ME = null;

/* Real-time exams synchronization from Firestore /exams collection */
let examsUnsubDoc = null;

function subscribeTeacherExams(userId) {
  if (examsUnsubDoc) {
    examsUnsubDoc();
    examsUnsubDoc = null;
  }
  try {
    const q = query(collection(db, "exams"), where("ownerUid", "==", userId));
    examsUnsubDoc = onSnapshot(q, snap => {
      const list = [];
      snap.forEach(docSnap => {
        const data = docSnap.data();
        list.push({ id: docSnap.id, ...data });
      });
      list.sort((a, b) => (b.ts || b.createdAt || 0) - (a.ts || a.createdAt || 0));
      S.e = list;
      render();
    }, err => {
      console.error("Firestore exams snapshot error:", err);
    });
  } catch (err) {
    console.error("Failed to subscribe to /exams collection:", err);
  }
}

async function loadExamsFromFirestore() {
  if (!ME) return;
  try {
    const q = query(collection(db, "exams"), where("ownerUid", "==", ME.uid));
    const snap = await getDocs(q);
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a, b) => (b.ts || b.createdAt || 0) - (a.ts || a.createdAt || 0));
    S.e = list;
    render();
  } catch (err) {
    console.error("loadExamsFromFirestore error:", err);
  }
}

/* Authentication Listener */
onAuthStateChanged(auth, async user => {
  if (user) {
    ME = user;
    AUE = ""; AUOK = "";
    const uref = doc(db, "users", user.uid);
    if (authUnsubDoc) authUnsubDoc();
    
    // Subscribe to exams in Firestore collection 'exams'
    subscribeTeacherExams(user.uid);
    
    authUnsubDoc = onSnapshot(uref, snap => {
      if (snap.exists()) {
        const d = snap.data();
        S.me = d.me || user.displayName || user.email.split("@")[0];
        S.c = Array.isArray(d.c) ? d.c : [];
        if ((!S.e || !S.e.length) && Array.isArray(d.e) && d.e.length > 0) {
          S.e = d.e;
        }
        S.a = Array.isArray(d.a) ? d.a : [];
        S.t = Array.isArray(d.t) ? d.t : [];
        S.th = d.th || "";
        S.sp = Array.isArray(d.sp) ? d.sp : [];
        S.tpp = d.tpp || {};
        render();
        syncAllTeacherAssignments();
        if (!window._teacherSyncInterval) {
          window._teacherSyncInterval = setInterval(syncAllTeacherAssignments, 8000);
        }
      } else {
        // Initialize user doc in Firestore
        S.me = user.displayName || user.email.split("@")[0];
        setDoc(uref, {
          me: S.me,
          email: user.email || "",
          c: [],
          e: [],
          a: [],
          t: [],
          th: "",
          sp: [],
          tpp: {},
          updatedAt: Date.now()
        });
        render();
      }
    }, err => {
      console.error("Firestore snapshot error:", err);
    });
  } else {
    ME = null;
    S = S0();
    if (examsUnsubDoc) { examsUnsubDoc(); examsUnsubDoc = null; }
    if (window._teacherSyncInterval) { clearInterval(window._teacherSyncInterval); window._teacherSyncInterval = null; }
    if (authUnsubDoc) { authUnsubDoc(); authUnsubDoc = null; }
    render();
  }
});

function getSmartReminders() {
  const reminders = [];
  const now = Date.now();

  for (const a of (S.a || [])) {
    const e = ex(a.eid);
    const c = cls(a.cid);
    const title = a.title || (e && e.title) || "Bài thi";
    const totalClassStudents = c && Array.isArray(c.st) ? c.st.length : 0;
    const submittedCount = (a.subs || []).length;
    const examUrl = `${window.location.origin}/lam-bai/${a.code}`;

    // 1. Check: Bài sắp đến hạn (trong vòng 48 giờ) hoặc mới đóng
    if (a.set && a.set.close) {
      const closeTime = new Date(a.set.close).getTime();
      const diffMs = closeTime - now;
      if (diffMs > 0 && diffMs <= 48 * 3600 * 1000) {
        const hoursLeft = Math.max(1, Math.round(diffMs / (3600 * 1000)));
        reminders.push({
          type: "due_soon",
          severity: diffMs < 12 * 3600 * 1000 ? "urgent" : "warn",
          aid: a.id,
          code: a.code,
          title: `Bài thi "${title}" sắp đóng hạn`,
          desc: `Hạn nộp lúc <b>${new Date(closeTime).toLocaleString('vi-VN')}</b> (còn khoảng <b>${hoursLeft} giờ</b>). Hiện đã có <b>${submittedCount}</b> bài nộp${totalClassStudents ? '/' + totalClassStudents + ' học sinh' : ''}.`,
          examUrl,
          total: totalClassStudents,
          submitted: submittedCount
        });
      } else if (diffMs < 0 && Math.abs(diffMs) <= 24 * 3600 * 1000) {
        reminders.push({
          type: "closed_recent",
          severity: "info",
          aid: a.id,
          code: a.code,
          title: `Bài thi "${title}" vừa đóng hạn`,
          desc: `Đã kết thúc thời gian làm bài lúc ${new Date(closeTime).toLocaleString('vi-VN')}. Tổng cộng nhận được <b>${submittedCount}</b> bài nộp.`,
          examUrl,
          total: totalClassStudents,
          submitted: submittedCount
        });
      }
    }

    // 2. Check: Bài còn nhiều học sinh chưa nộp
    if (c && totalClassStudents > 0) {
      const submittedNames = new Set((a.subs || []).map(s => (s.name || '').trim().toLowerCase()));
      const missingStudents = c.st.filter(name => !submittedNames.has((name || '').trim().toLowerCase()));
      const missingCount = missingStudents.length;

      if (missingCount > 0 && (missingCount >= 5 || (missingCount / totalClassStudents) >= 0.3)) {
        const percentDone = Math.round(((totalClassStudents - missingCount) / totalClassStudents) * 100);
        reminders.push({
          type: "low_submission",
          severity: percentDone < 40 ? "urgent" : "warn",
          aid: a.id,
          code: a.code,
          cid: c.id,
          className: c.n,
          title: `Lớp ${c.n}: còn ${missingCount}/${totalClassStudents} học sinh chưa nộp bài`,
          desc: `Bài thi: <b>${esc(title)}</b> · Mới có <b>${totalClassStudents - missingCount}/${totalClassStudents}</b> em hoàn thành (<b>${percentDone}%</b>).`,
          missing: missingStudents,
          examUrl,
          closeStr: a.set && a.set.close ? new Date(a.set.close).toLocaleString('vi-VN') : 'Sớm'
        });
      }
    }
  }

  return reminders;
}

function repAsgTab() {
  const asgList = [...S.a].reverse();
  const a = S.a.find(x => x.id == REP.asgId) || S.a[S.a.length - 1];
  if (!a) return '<div class="card empty">Không tìm thấy bài giao.</div>';

  const e = ex(a.eid);
  const c = cls(a.cid);
  const su = a.subs || [];
  const scale = a.set?.scale || 10;
  const passThreshold = a.set?.pass || 50;

  // Stats
  const avg = su.length ? (su.reduce((x, s) => x + Number(s.sc || 0), 0) / su.length).toFixed(1) : "–";
  const maxScore = su.length ? Math.max(...su.map(s => Number(s.sc) || 0)) : "–";
  const minScore = su.length ? Math.min(...su.map(s => Number(s.sc) || 0)) : "–";
  const passedCount = su.filter(s => {
    const rate = s.n > 0 ? (s.cor / s.n) * 100 : 0;
    return rate >= passThreshold;
  }).length;
  const passPercent = su.length ? Math.round((passedCount / su.length) * 100) : 0;
  const st = aStatus(a);
  const examUrl = `${window.location.origin}/lam-bai/${a.code}`;

  // Missing students
  let missingStudents = [];
  if (c && Array.isArray(c.st)) {
    const subNames = new Set(su.map(s => (s.name || '').trim().toLowerCase()));
    missingStudents = c.st.filter(name => !subNames.has((name || '').trim().toLowerCase()));
  }

  // Score distribution counts
  let distGood = 0, distFair = 0, distAvg = 0, distWeak = 0;
  su.forEach(s => {
    const sc = Number(s.sc) || 0;
    if (scale == 100) {
      if (sc >= 85) distGood++;
      else if (sc >= 70) distFair++;
      else if (sc >= 50) distAvg++;
      else distWeak++;
    } else {
      if (sc >= 8.5) distGood++;
      else if (sc >= 7.0) distFair++;
      else if (sc >= 5.0) distAvg++;
      else distWeak++;
    }
  });

  const pct = cnt => su.length ? Math.round((cnt / su.length) * 100) : 0;

  // Most missed questions
  const missedStats = [];
  if (e && Array.isArray(e.qs) && su.length > 0) {
    e.qs.forEach((q, idx) => {
      let totalAns = 0;
      let wrongCount = 0;
      const choices = [0, 0, 0, 0];
      su.forEach(s => {
        if (s.ans && s.ans[idx] !== undefined && s.ans[idx] !== null) {
          totalAns++;
          const choice = Number(s.ans[idx]);
          if (choice >= 0 && choice <= 3) choices[choice]++;
          if (choice !== q.a) wrongCount++;
        }
      });
      if (totalAns > 0 && wrongCount > 0) {
        missedStats.push({
          idx,
          qNum: idx + 1,
          q,
          totalAns,
          wrongCount,
          choices,
          wrongRate: Math.round((wrongCount / totalAns) * 100)
        });
      }
    });
    missedStats.sort((x, y) => y.wrongRate - x.wrongRate || y.wrongCount - x.wrongCount);
  }

              </span>

            <div class="row" style="gap:6px;font-size:.82rem">

              </div>`;
            }).join("")}

          <div style="padding:10px 14px;background:var(--card);border-radius:10px;border-left:3px solid var(--pri);font-size:.88rem">

        </div>`;

  </div>`;
}

function repClassTab() {
  if (!S.c || S.c.length === 0) {
    return `<div class="card empty">Chưa có lớp học nào. Hãy vào mục "Quản lý lớp" để thêm lớp và danh sách học sinh.</div>`;
  }

  const c = cls(REP.clsId) || S.c[0];
  const asgs = S.a.filter(a => a.cid == c.id).sort((x, y) => (x.at || 0) - (y.at || 0));
  const students = c.st || [];

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="row sb" style="flex-wrap:wrap;gap:10px">
      <div style="flex:1;min-width:260px">
        <label for="rep_cls_select" style="font-weight:700">Chọn lớp cần xem bảng điểm:</label>
        <select id="rep_cls_select" data-act="repClsChange" style="margin-top:4px">
          ${S.c.map(item => `<option value="${item.id}" ${item.id == c.id ? 'selected' : ''}>Lớp ${esc(item.n)} (Khối ${item.g} · ${item.st.length} học sinh)</option>`).join("")}
        </select>
      </div>
      <div class="row" style="gap:8px;align-self:flex-end">
        <button class="btn s" data-act="repExportClassExcel" data-cid="${c.id}">📥 Xuất Excel bảng điểm lớp (.xlsx)</button>
        <button class="btn o s" data-act="xGrades" data-id="${c.id}">📋 Xuất CSV</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row sb" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div>
        <h2 style="margin:0">Bảng điểm lớp ${esc(c.n)} theo thời gian</h2>
        <div class="mute small">Khối ${c.g} · ${students.length} học sinh · ${asgs.length} bài thi đã giao</div>
      </div>
      <div class="mute small">Bấm vào điểm để xem bài làm chi tiết · Bấm nút "Phiếu điểm" để tải bảng điểm cá nhân</div>
    </div>

    ${asgs.length ? `
    <div class="mxtbl-wrap">
      <table class="mxtbl">
        <thead>
          <tr>
            <th class="fix-col" style="width:40px">STT</th>
            <th class="fix-col" style="left:40px;width:90px">Mã HS</th>
            <th class="fix-col" style="left:130px;min-width:180px">Họ và tên học sinh</th>
            ${asgs.map((a, i) => {
              const dt = new Date(a.at).toLocaleDateString("vi-VN", { day: '2-digit', month: '2-digit' });
              return `<th style="text-align:center;min-width:130px">
                <div style="font-weight:600">${esc(a.title || 'Bài ' + (i + 1))}</div>
                <div class="mute small">${dt} · Thang ${a.set?.scale || 10}</div>
              </th>`;
            }).join("")}
            <th style="text-align:center;min-width:90px">Điểm TB</th>
            <th style="text-align:center;min-width:90px">Đã nộp</th>
            <th style="text-align:center;min-width:110px">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          ${students.map((stName, idx) => {
            const stCode = (c.info && c.info[stName]?.code) || `HS${String(idx + 1).padStart(3, '0')}`;
            let totalScore = 0;
            let submittedCount = 0;

            const cells = asgs.map(a => {
              const scale = a.set?.scale || 10;
              const stSubs = (a.subs || []).filter(s => (s.studentCode && s.studentCode === stCode) || (s.name && s.name.trim().toLowerCase() === stName.trim().toLowerCase()));
              if (stSubs.length) {
                const latest = stSubs[stSubs.length - 1];
                const sc = Number(latest.sc) || 0;
                totalScore += sc;
                submittedCount++;
                const isPass = sc >= (scale == 100 ? 50 : 5);
                return `<td style="text-align:center">
                  <button class="score-badge ${isPass ? 'score-pass' : 'score-fail'}" style="border:none;cursor:pointer" data-act="repViewSub" data-aid="${a.id}" data-subid="${latest.id}" title="Xem bài làm">
                    ${sc}
                  </button>
                </td>`;
              }
              return `<td style="text-align:center"><span class="score-none">Chưa nộp</span></td>`;
            });

            const avg = submittedCount > 0 ? (totalScore / submittedCount).toFixed(1) : "–";
            const isPassAvg = Number(avg) >= 5;

            return `<tr>
              <td class="fix-col" style="width:40px;text-align:center">${idx + 1}</td>
              <td class="fix-col" style="left:40px;width:90px"><span class="mute small">${esc(stCode)}</span></td>
              <td class="fix-col" style="left:130px;min-width:180px"><b>${esc(stName)}</b></td>
              ${cells.join("")}
              <td style="text-align:center"><b style="color:${avg != '–' ? (isPassAvg ? 'var(--ok)' : 'var(--bad)') : 'var(--mute)'}">${avg}</b></td>
              <td style="text-align:center"><span class="tag">${submittedCount}/${asgs.length}</span></td>
              <td style="text-align:center">
                <button class="btn o s" data-act="repExportStudentReport" data-cid="${c.id}" data-stname="${esc(stName)}" title="Xuất phiếu báo điểm cá nhân">
                  📄 Phiếu điểm
                </button>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>` : `<div class="empty">Chưa có bài thi nào được giao riêng cho lớp này. Hãy bấm "Giao bài cho lớp" và chọn lớp ${esc(c.n)}.</div>`}
  </div>`;
}

function repDistTab() {
  const rows = subs();
  CSV = "Lớp,Đề,Mã bài,Học sinh,Điểm,Số câu đúng,Tổng câu,Thời gian làm,Thời điểm nộp\n" + rows.map(s => [

          <th>Tỉ lệ đạt</th>
          <th>Thời gian làm</th>
          <th>Thời điểm giao</th>
          <th>Thao tác</th>
        </tr>
        ${S.a.map(a => {
          const e = ex(a.eid);
          const c = cls(a.cid);
          const su = a.subs || [];
          const avg = su.length ? (su.reduce((acc, s) => acc + Number(s.sc || 0), 0) / su.length).toFixed(1) : "–";

        <h3 style="margin:0">Xuất dữ liệu CSV</h3>

      </div>
      <button class="btn" data-act="copyCsv">📋 Sao chép CSV</button>
    </div>
    <textarea id="cv" readonly style="width:100%;min-height:160px;font-family:monospace;font-size:.85rem">${esc(CSV)}</textarea>
  </div>`;
}

function repSubModalV() {
  if (!REP.subModal) return "";
  const { aid, subId } = REP.subModal;
  const a = S.a.find(x => x.id == aid);
  if (!a) return "";
  const s = (a.subs || []).find(x => x.id == subId);
  if (!s) return "";
  const e = ex(a.eid);
  if (!e || !e.qs) return "";

  const scale = a.set?.scale || 10;
  const passThreshold = a.set?.pass || 50;
  const rate = s.n > 0 ? Math.round((s.cor / s.n) * 100) : 0;

  return `<div class="mdl-wide" onclick="if(event.target===this){REP.subModal=null;render();}">
    <div class="card">
      <div class="mdl-head">
        <div>
          <h2 style="margin:0">${esc(s.name)} · Chi tiết bài làm</h2>
          <div class="mute small">${esc(a.title || e.title)} · Nộp lúc ${new Date(s.at).toLocaleString("vi-VN")}</div>
        </div>
        <button class="btn o s" data-act="repCloseSubModal">✕ Đóng</button>
      </div>
      <div class="mdl-body">
        <div class="card" style="background:var(--bg);margin-bottom:16px;padding:14px">
          <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
            <div><span class="mute small">Điểm số:</span><br><b style="font-size:1.4rem;color:${rate >= passThreshold ? 'var(--ok)' : 'var(--bad)'}">${s.sc}</b>/${scale}</div>
            <div><span class="mute small">Số câu đúng:</span><br><b style="font-size:1.2rem">${s.cor}/${s.n}</b> (${rate}%)</div>
            <div><span class="mute small">Thời gian làm:</span><br><b style="font-size:1.2rem">${fmt(s.used)}</b></div>
            <div><span class="mute small">Kết quả:</span><br><span class="tag ${rate >= passThreshold ? 'ok' : 'w'}" style="margin-top:4px">${rate >= passThreshold ? 'Đạt' : 'Chưa đạt'}</span></div>
          </div>
        </div>

        <h3 style="margin-bottom:12px">Danh sách ${e.qs.length} câu hỏi và đáp án:</h3>
        <div style="display:flex;flex-direction:column;gap:16px">
          ${e.qs.map((q, idx) => {
            const userAns = s.ans ? s.ans[idx] : null;
            const ok = userAns !== null && userAns !== undefined && userAns === q.a;
            const hasAns = userAns !== null && userAns !== undefined;

            return `<div class="card" style="border-left:4px solid ${ok ? 'var(--ok)' : 'var(--bad)'};padding:14px">
              <div class="row sb" style="margin-bottom:8px">
                <b>Câu ${idx + 1}</b>
                <span class="tag ${ok ? '' : 'w'}" style="${ok ? 'background:var(--okbg);color:var(--ok)' : 'background:var(--badbg);color:var(--bad)'}">
                  ${ok ? '✓ Đúng' : hasAns ? '✗ Sai' : '○ Bỏ trống'}
                </span>
              </div>
              ${q.p ? `<div class="pane" style="background:var(--bg);padding:10px;margin-bottom:10px;white-space:pre-wrap;font-size:.9rem">${fm(q.p)}</div>` : ''}
              <div style="margin-bottom:10px;font-weight:500">${fm(q.q)}</div>
              <div style="display:grid;gap:6px">
                ${(q.o || []).map((opt, oIdx) => {
                  const isCorrect = oIdx === q.a;
                  const isUserPick = oIdx === userAns;
                  let bgStyle = "background:var(--card);border:1px solid var(--line);";
                  if (isCorrect) bgStyle = "background:var(--okbg);border:1.5px solid var(--ok);font-weight:600;color:var(--ok);";
                  else if (isUserPick && !ok) bgStyle = "background:var(--badbg);border:1.5px solid var(--bad);font-weight:600;color:var(--bad);";
                  
                  return `<div style="padding:6px 10px;border-radius:8px;${bgStyle}">
                    <b>${"ABCD"[oIdx]}.</b> ${fm(opt)}
                    ${isCorrect ? ' <span style="color:var(--ok)">✓ (Đáp án đúng)</span>' : ''}
                    ${isUserPick && !ok ? ' <span style="color:var(--bad)">✗ (Học sinh chọn)</span>' : ''}
                    ${isUserPick && ok ? ' <span style="color:var(--ok)">✓ (Học sinh chọn đúng)</span>' : ''}
                  </div>`;
                }).join("")}
              </div>
              ${(q.ex || q.exp || q.expl) ? `<div style="margin-top:10px;padding:8px 12px;background:var(--bg);border-radius:8px;border-left:3px solid var(--pri);font-size:.88rem">
                <b>💡 Lời giải chi tiết:</b>
                <div style="margin-top:4px;white-space:pre-wrap">${esc(q.ex || q.exp || q.expl)}</div>
              </div>` : ''}
            </div>`;
          }).join("")}
        </div>
      </div>
      <div class="mdl-foot">
        <button class="btn s" data-act="repAiFeedback" data-aid="${a.id}" data-subid="${s.id}">✨ AI Phản hồi cá nhân hóa</button>
        <button class="btn o s" data-act="repCloseSubModal">Đóng</button>
      </div>
    </div>
  </div>`;
}

        <button class="btn o s" data-act="repCloseAiModal">✕</button>

          🔒 <b>Bảo vệ quyền riêng tư học sinh:</b> Hệ thống chỉ phân tích điểm số và dạng câu sai, <b>TUYỆT ĐỐI không gửi họ tên</b> học sinh tới máy chủ AI.

          <div class="card" style="white-space:pre-wrap;line-height:1.6;font-size:.95rem;padding:16px;background:var(--card);border:1.5px solid var(--line)" id="aiFeedbackContent">${fm(text)}</div>
        </div>` : '<div class="empty">Chưa có nội dung nhận xét.</div>'}
      </div>
      <div class="mdl-foot">
        ${text && !loading ? `<button class="btn s" data-act="repCopyAiFeedback">📋 Sao chép nhận xét</button><button class="btn o s" data-act="repRegenAi" data-aid="${aid}" data-subid="${subId}">🔄 Tạo lại nhận xét</button>` : ''}
        <button class="btn o s" data-act="repCloseAiModal">Đóng</button>
      </div>

function repMissingModalV() {
  if (!REP.missingModal) return "";
  const { aid, list, className, title } = REP.missingModal;

  return `<div class="mdl" onclick="if(event.target===this){REP.missingModal=null;render();}">

/* ====================================================
   AI PERSONALIZED FEEDBACK (STRICT PRIVACY)
==================================================== */
async function generateAiFeedback(aid, subId, forceRegen = false) {
  const a = S.a.find(x => x.id == aid);
  if (!a) return toast("Không tìm thấy bài giao.");
  const s = (a.subs || []).find(x => x.id == subId);
  if (!s) return toast("Không tìm thấy bài nộp.");
  const e = ex(a.eid);
  if (!e) return toast("Không tìm thấy đề thi.");

  if (!forceRegen && s.aiFeedback) {
    REP.aiModal = { aid, subId, loading: false, text: s.aiFeedback, err: "" };
    return render();
  }

  REP.aiModal = { aid, subId, loading: true, text: "", err: "" };
  render();

  try {
    const scale = a.set?.scale || 10;
    const wrongItems = [];
    e.qs.forEach((q, idx) => {
      const userAns = s.ans ? s.ans[idx] : null;
      if (userAns !== q.a) {
        let category = "Ngữ pháp & Từ vựng";
        if (q.leaflet || (q.p && /leaflet|notice|announcement/i.test(q.p))) category = "Đọc hiểu tờ rơi / Thông báo (Leaflet)";
        else if (q.ad || (q.p && /advertisement/i.test(q.p))) category = "Đọc hiểu thông tin quảng cáo";
        else if (q.q && (q.q.includes("\n") || /sắp xếp|thứ tự/i.test(q.q))) category = "Sắp xếp trật tự câu / hội thoại / đoạn văn";
        else if (q.p && /\(\d+\)/.test(q.p)) category = "Điền khuyết cụm từ / mệnh đề vào đoạn văn";
        else if (q.p && q.p.length > 200) category = "Đọc hiểu văn bản (Reading comprehension)";

        wrongItems.push({
          n: idx + 1,
          category,
          userChoice: userAns != null && userAns >= 0 ? "ABCD"[userAns] : "Bỏ trống",
          correctChoice: "ABCD"[q.a],
          hint: (q.ex || q.exp || q.expl || "").slice(0, 150)
        });
      }
    });

    const wrongSummary = wrongItems.length ? wrongItems.map(w =>
      `- Câu ${w.n} (${w.category}): Chọn ${w.userChoice}, Đáp án đúng: ${w.correctChoice}${w.hint ? ' (Lời giải: ' + w.hint + ')' : ''}`
    ).join("\n") : "Học sinh trả lời đúng tất cả các câu hỏi (100% chính xác)!";

    // STRICT PRIVACY: DO NOT SEND STUDENT NAME OR IDENTIFIERS TO AI
    const prompt = `Bạn là giáo viên Tiếng Anh THPT giàu kinh nghiệm. Hãy viết một bản nhận xét và phản hồi sư phạm cá nhân hóa cho một học sinh sau khi làm bài thi tiếng Anh THPT.

KẾT QUẢ BÀI THI (ẨN DANH HOÀN TOÀN - TUYỆT ĐỐI KHÔNG CÓ THÔNG TIN CÁ NHÂN):
- Bài thi: ${a.title || e.title}
- Điểm số: ${s.sc}/${scale} điểm (Đúng ${s.cor}/${s.n} câu)
- Thời gian làm bài: ${fmt(s.used)}
- Kết quả: ${s.passed ? "ĐẠT YÊU CẦU" : "CHƯA ĐẠT"}

DANH SÁCH LỖI SAI THEO DẠNG CÂU VÀ KIẾN THỨC:
${wrongSummary}

YÊU CẦU NỘI DUNG NHẬN XÉT:
1. Lời động viên, khen ngợi tinh thần làm bài và các phần làm tốt.
2. Phân tích cụ thể các dạng câu làm sai (chỉ ra nguyên nhân nhầm lẫn: ngữ pháp, từ vựng, collocation, đọc lướt tìm ý chính hay logic kết nối câu).
3. Đề xuất 3 mẹo / bài tập ôn luyện cụ thể để học sinh khắc phục và bứt phá điểm số ở bài tiếp theo.
4. Giọng điệu: Khích lệ, chân thành, mang tính định hướng sư phạm tích cực. Độ dài: khoảng 200-260 từ tiếng Việt.
TUYỆT ĐỐI KHÔNG xưng hô họ tên học sinh, không nhắc đến tên riêng.`;

    const res = await viaGemini(prompt);
    s.aiFeedback = res.text;
    saveNow(); // persist feedback to Firestore!
    REP.aiModal = { aid, subId, loading: false, text: res.text, err: "" };
    render();
  } catch (err) {
    console.error("AI feedback error:", err);
    REP.aiModal = { aid, subId, loading: false, text: "", err: err.detail || err.message || "Lỗi tạo phản hồi AI." };
    render();
  }
}

function copyReminderMessage(aid) {
  const a = S.a.find(x => x.id == aid);
  if (!a) return toast("Không tìm thấy bài giao.");
  const c = cls(a.cid);
  const e = ex(a.eid);
  const title = a.title || (e && e.title) || "Bài thi";
  const examUrl = `${window.location.origin}/lam-bai/${a.code}`;
  const closeStr = a.set && a.set.close ? new Date(a.set.close).toLocaleString("vi-VN") : "Sớm";

  let missingListStr = "";
  if (c && Array.isArray(c.st)) {
    const subNames = new Set((a.subs || []).map(s => (s.name || '').trim().toLowerCase()));
    const missing = c.st.filter(name => !subNames.has((name || '').trim().toLowerCase()));
    if (missing.length) {
      missingListStr = `\n📋 Các bạn chưa nộp bài:\n${missing.map((n, i) => `${i + 1}. ${n}`).join("\n")}\n`;
    }
  }

  const msg = `📢 [THÔNG BÁO NHẮC NHỞ LÀM BÀI THI TIẾNG ANH${c ? ' - LỚP ' + c.n : ''}]
Thầy/cô nhắc các em hoàn thành bài thi: "${title}"
⏰ Thời hạn chót: ${closeStr}
⏱️ Thời gian làm bài: ${a.set?.min || 45} phút
${missingListStr}
👉 Link làm bài trực tiếp (không cần tài khoản):
${examUrl}

Các em mở link, nhập họ tên để làm bài nghiêm túc nhé!`;

  navigator.clipboard.writeText(msg).then(() => {
    toast("Đã sao chép tin nhắn nhắc nhở nhóm lớp vào bộ nhớ tạm!");
  }).catch(() => {
    toast("Không thể tự động sao chép. Hãy chọn và sao chép thủ công.");
  });
}

function copyMissingList(aid) {
  const a = S.a.find(x => x.id == aid);
  if (!a) return toast("Không tìm thấy bài giao.");
  const c = cls(a.cid);
  if (!c) return toast("Bài thi này không gán theo lớp.");

  const subNames = new Set((a.subs || []).map(s => (s.name || '').trim().toLowerCase()));

  const text = `Danh sách học sinh lớp ${c.n} chưa nộp bài "${a.title}":\n` + missing.map((n, i) => `${i + 1}. ${n}`).join("\n");

  }).catch(() => {
    toast("Lỗi sao chép.");
  });
}

/* ====================================================
   EXCEL EXPORT IMPLEMENTATIONS (SheetJS)
==================================================== */
async function exportClassGradebookExcel(cid) {
  const c = cls(cid);
  if (!c) return toast("Không tìm thấy thông tin lớp.");
  if (!window.XLSX) {
    try { await loadJS(XLS); } catch (e) { return toast("Không tải được thư viện Excel."); }
  }

  const asgs = S.a.filter(a => a.cid == c.id).sort((x, y) => (x.at || 0) - (y.at || 0));
  const H = ["STT", "Mã HS", "Họ và tên", ...asgs.map(a => `${a.title} (${new Date(a.at).toLocaleDateString("vi-VN")})`), "Điểm TB", "Số bài nộp", "Tỉ lệ hoàn thành (%)"];

  const rows = [];
  rows.push([`BẢNG ĐIỂM THEO THỜI GIAN - LỚP ${c.n.toUpperCase()}`]);
  rows.push([`Khối: ${c.g} | Giáo viên phụ trách: ${S.me} | Ngày xuất: ${new Date().toLocaleDateString("vi-VN")}`]);
  rows.push([]);
  rows.push(H);

  const students = c.st || [];
  const colAverages = asgs.map(() => ({ total: 0, count: 0 }));

  students.forEach((stName, idx) => {
    const stCode = (c.info && c.info[stName]?.code) || `HS${String(idx + 1).padStart(3, '0')}`;
    let totalScore = 0;
    let submittedCount = 0;
    const scores = asgs.map((a, aIdx) => {
      const stSubs = (a.subs || []).filter(s => (s.studentCode && s.studentCode === stCode) || (s.name && s.name.trim().toLowerCase() === stName.trim().toLowerCase()));
      if (stSubs.length) {
        const best = Math.max(...stSubs.map(x => Number(x.sc) || 0));
        totalScore += best;
        submittedCount++;
        colAverages[aIdx].total += best;
        colAverages[aIdx].count++;
        return best;
      }
      return "Chưa nộp";
    });

    const avg = submittedCount > 0 ? Math.round((totalScore / submittedCount) * 10) / 10 : "";
    const pct = asgs.length > 0 ? Math.round((submittedCount / asgs.length) * 100) : 0;
    rows.push([idx + 1, stCode, stName, ...scores, avg, `${submittedCount}/${asgs.length}`, `${pct}%`]);
  });

  // Summary row
  if (students.length > 0) {
    const avgCols = colAverages.map(ca => ca.count > 0 ? Math.round((ca.total / ca.count) * 10) / 10 : "-");
    const overallAvg = colAverages.reduce((acc, ca) => acc + ca.total, 0) / Math.max(1, colAverages.reduce((acc, ca) => acc + ca.count, 0));
    rows.push(["", "", "ĐIỂM TRUNG BÌNH CẢ LỚP", ...avgCols, Math.round(overallAvg * 10) / 10, "", ""]);
  }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [6, 14, 26, ...asgs.map(() => ({ wch: 22 })), { wch: 12 }, { wch: 14 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, ws, `Bang diem lop ${c.n}`);

  const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const aTag = document.createElement("a");
  aTag.href = url;
  aTag.download = `Bang-diem-lop-${c.n}-${new Date().toISOString().slice(0, 10)}.xlsx`;
  document.body.appendChild(aTag);
  aTag.click();
  setTimeout(() => { URL.revokeObjectURL(url); aTag.remove(); }, 1500);
  toast(`Đã xuất bảng điểm lớp ${c.n} ra file Excel thành công!`);
}

        "–",

  document.body.appendChild(aTag);

  setTimeout(() => { URL.revokeObjectURL(url); aTag.remove(); }, 1500);

}

/* Viewer logic */
let VW = null;
function blocks(qs) {
  const B = [];
  qs.forEach((q, i) => {
    const ml = q.q.includes("\n"), key = q.p ? "p:" + q.p : ml ? "m:" + i : "", last = B[B.length - 1];
    if (key && q.p && last && last.key == key) last.items.push({ q, n: i + 1 });
    else if (!key && last && last.key === "") last.items.push({ q, n: i + 1 });
    else B.push({ key, left: q.p || (ml ? q.q : ""), items: [{ q, n: i + 1 }] });
  });
  return B;
}

const vItem = (q, n, ans, rev) => {
  const alone = !q.p && q.q.includes("\n"), pk = rev ? rev[n - 1] : undefined, wrong = rev && pk !== q.a;
  return `<div style="margin-bottom:18px">${alone ? "<b>" + n + ".</b> Chọn thứ tự sắp xếp đúng:" : qTxt(q, n)}${q.chk && ans ? ' <span class="tag w">cần kiểm tra đáp án</span>' : ""}${q.o.map((o, i) => {
    const ok = ans && i == q.a, bad = rev && pk === i && i != q.a;
    return `<div style="padding:4px 8px;margin:3px 0;border-radius:8px;${ok ? "background:var(--okbg);color:var(--ok);font-weight:600" : bad ? "background:var(--badbg);color:var(--bad);font-weight:600" : ""}"><b>${"ABCD"[i]}.</b> ${fm(o)}${ok ? " ✓" : ""}${bad ? " ✗ bạn chọn" : ""}</div>`;
  }).join("")}${rev && pk == null ? '<div class="small mute">Bạn chưa trả lời câu này.</div>' : ""}${wrong ? `<button class="btn o s" data-act="explain" data-i="${n - 1}">Giải thích bằng AI</button>${(q.ex || EXP[n - 1]) ? '<div class="card" style="padding:10px;margin:6px 0 0;white-space:pre-wrap">' + esc((q.ex || EXP[n - 1])) + '<div class="small mute" style="margin-top:4px">AI giải thích, giáo viên nên kiểm tra lại.</div></div>' : ""}` : ""}</div>`;
};

function viewer() {
  const B = blocks(VW.qs);
  if (!B.length) return '<div class="card empty">Đề chưa có câu hỏi.<br><br><button class="btn" data-act="vclose">Quay lại</button></div>';
  const i = Math.max(0, Math.min(VW.i, B.length - 1));
  VW.i = i;
  const b = B[i], lo = b.items[0].n, hi = b.items[b.items.length - 1].n;
  return `<div class="row sb" style="margin-bottom:10px"><div><b style="font-size:1.1rem">${esc(VW.t)}</b><div class="mute small">Phần ${i + 1}/${B.length} · Câu ${lo === hi ? lo : lo + "–" + hi}</div></div><button class="btn o" data-act="vclose">Đóng</button></div>
  <div class="row" style="margin-bottom:10px"><button class="btn o s" data-act="vgo" data-d="-1" ${i ? "" : "disabled"}>Phần trước</button><select id="vsel" style="width:auto" aria-label="Chọn phần">${B.map((x, k) => `<option value="${k}" ${k == i ? "selected" : ""}>Phần ${k + 1}: câu ${x.items[0].n}${x.items.length > 1 ? "–" + x.items[x.items.length - 1].n : ""}</option>`).join("")}</select><button class="btn o s" data-act="vgo" data-d="1" ${i < B.length - 1 ? "" : "disabled"}>Phần sau</button><label style="margin:0;display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" id="vans" style="width:auto" ${VW.ans ? "checked" : ""}>Hiện đáp án</label></div>
  <div class="split ${b.left ? "" : "one"}">${b.left ? `<div class="pane" tabindex="0" aria-label="Nội dung bài"><div class="mute small" style="margin-bottom:6px">Nội dung bài</div><div style="white-space:pre-wrap">${fm(b.left)}</div></div>` : ""}<div class="pane" tabindex="0" aria-label="Câu hỏi"><div class="mute small" style="margin-bottom:6px">Câu hỏi</div>${b.items.map(x => vItem(x.q, x.n, VW.ans, VW.rev)).join("")}</div></div>`;
}
V.viewer = viewer;

/* Taking Exam Logic */
let TK = null, TKP = null, TI = null, EXP = {}, TP = { g: "12", u: 1, cf: "", tab: "thpt", q: "", g2: "", sort: "new" }, TG = { run: null, err: "", caches: {} };
const fmt = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function startTake(P, min, name) {
  TK = { qs: P.qs, t: P.t, ans: Array(P.qs.length).fill(null), fl: Array(P.qs.length).fill(0), i: 0, end: Date.now() + min * 60000, t0: Date.now(), min, aid: P.aid, eid: P.eid, name, back: P.back, cf: 0, done: false };
  EXP = {};
  clearInterval(TI);
  TI = setInterval(tick, 1000);
  go("take");
}

function tick() {
  if (!TK || TK.done) return clearInterval(TI);
  const l = Math.max(0, TK.end - Date.now()), el = $("tm");
  if (el) { el.textContent = fmt(l); el.classList.toggle("low", l <= 300000); }
  if (l <= 300000 && l > 0 && !TK.w5) { TK.w5 = 1; toast("Còn 5 phút."); }
  if (l <= 60000 && l > 0 && !TK.w1) { TK.w1 = 1; toast("Còn 1 phút!"); }
  if (l <= 0) { toast("Hết giờ, bài được nộp tự động."); submitTake(); }
}

function submitTake() {
  const n = TK.qs.length, cor = TK.ans.filter((a, i) => a === TK.qs[i].a).length;
  TK.cor = cor; TK.sc = Math.round(cor / n * 100) / 10; TK.used = Math.min(Date.now() - TK.t0, TK.min * 60000); TK.done = true;
  clearInterval(TI); closeXm();
  if (TK.eid && !TK.aid) {
    const e0 = ex(TK.eid);
    if (e0) { (e0.tries = e0.tries || []).push({ sc: TK.sc, cor, n, at: Date.now(), used: TK.used }); if (e0.tries.length > 50) e0.tries.shift(); saveNow(); }
  }
  if (TK.aid) {
    const a = S.a.find(x => x.id == TK.aid);
    if (a) { a.subs.push({ name: TK.name, sc: TK.sc, at: Date.now(), sim: 0, seen: 0, cor, n, ans: TK.ans }); saveNow(); }
  }
  go("tresult");
}

const takeItem = (q, n) => {
  const alone = !q.p && q.q.includes("\n");
  return `<div style="margin-bottom:18px">${alone ? "<b>" + n + ".</b> Chọn thứ tự sắp xếp đúng:" : qTxt(q, n)}${q.o.map((o, i) => `<button class="opt" data-act="tpick" data-n="${n - 1}" data-o="${i}" aria-pressed="${TK.ans[n - 1] === i}"><b>${"ABCD"[i]}.</b> ${fm(o)}</button>`).join("")}<button class="btn o s flg" data-act="tflag" data-n="${n - 1}" aria-pressed="${!!(TK.fl && TK.fl[n - 1])}">${TK.fl && TK.fl[n - 1] ? "⚑ Đã gắn cờ" : "⚐ Gắn cờ xem lại"}</button></div>`;
};

function takeStart() {
  const P = TKP, def = P.min || Math.max(5, Math.round(P.qs.length * 1.25)); P.def = def;
  return `<h1>Làm bài</h1><div class="card"><b>${esc(P.t)}</b><div class="mute">${P.qs.length} câu. Vào phòng thi, menu bên trái sẽ tự ẩn để dành toàn màn hình: nội dung bên trái, câu hỏi bên phải, thước câu hỏi ở chân trang.</div>${P.aid ? `<label for="tst">Học sinh làm bài</label><select id="tst"><option value="">Chọn học sinh</option>${P.left.map(n => `<option>${esc(n)}</option>`).join("")}</select>` : P.eid ? '<div class="small mute" style="margin-top:6px">Điểm và lịch sử thi thử sẽ được lưu tự động vào tài khoản giáo viên trên Firestore.</div>' : '<div class="small mute" style="margin-top:6px">Làm thử: kết quả không được lưu.</div>'}<label for="tmin">Thời gian (phút)</label><input id="tmin" type="number" min="1" value="${def}" style="max-width:140px"><div class="row" style="margin-top:12px"><button class="btn" data-act="tstart">Bắt đầu làm bài</button><button class="btn o" data-act="tback">Quay lại</button></div></div>`;
}

function take() {
  const B = blocks(TK.qs), n = TK.qs.length; TK.i = Math.max(0, Math.min(TK.i, B.length - 1)); const i = TK.i, b = B[i], lo = b.items[0].n, hi = b.items[b.items.length - 1].n; if (!TK.fl) TK.fl = Array(n).fill(0);
  return `<div class="xw"><div class="row sb xh"><div><b style="font-size:1.1rem">${esc(TK.t)}</b>${TK.name ? ' · ' + esc(TK.name) : ""}<div class="mute small">Phần ${i + 1}/${B.length} · Câu ${lo === hi ? lo : lo + "–" + hi}</div></div><div class="row"><b id="tm" class="xtm" role="timer" aria-label="Thời gian còn lại">${fmt(Math.max(0, TK.end - Date.now()))}</b><button class="btn d s" data-act="tquit">Thoát bài thi</button><button class="btn" data-act="tsubmit">Nộp bài</button></div></div>
  <div class="split ${b.left ? "" : "one"}">${b.left ? `<div class="pane" tabindex="0" aria-label="Nội dung bài"><div class="mute small" style="margin-bottom:6px">Nội dung bài</div><div style="white-space:pre-wrap">${fm(b.left)}</div></div>` : ""}<div class="pane" tabindex="0" aria-label="Câu hỏi"><div class="mute small" style="margin-bottom:6px">Câu hỏi</div>${b.items.map(x => takeItem(x.q, x.n)).join("")}</div></div>
  <div class="xf"><div class="row sb" style="margin-bottom:6px"><span class="small mute"><span class="lg on"></span>Đã làm <span class="lg fl"></span>Gắn cờ <span class="lg"></span>Chưa làm</span><span class="row"><button class="btn o s" data-act="tgo" data-d="-1" ${i ? "" : "disabled"}>Phần trước</button><button class="btn o s" data-act="tgo" data-d="1" ${i < B.length - 1 ? "" : "disabled"}>Phần sau</button></span></div>
  <div class="xp" role="group" aria-label="Thước câu hỏi">${TK.qs.map((q, k) => `<button class="chip ${TK.ans[k] != null ? "on" : ""} ${TK.fl[k] ? "fl" : ""} ${k + 1 >= lo && k + 1 <= hi ? "cur" : ""}" id="pc${k}" data-act="tjump" data-n="${k}" aria-label="Câu ${k + 1}">${k + 1}</button>`).join("")}</div></div></div>`;
}

function xm(kind) {
  closeXm(); const n = TK.qs.length, un = TK.ans.filter(a => a == null).length, fl = TK.fl.filter(Boolean).length, d = document.createElement("div"); d.className = "mdl"; d.id = "xmdl"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true");
  d.innerHTML = kind == "quit" ? `<div class="card"><h2>Thoát bài thi?</h2><p>Bài làm hiện tại sẽ <b>không được lưu</b> và đồng hồ sẽ dừng. Bạn có chắc muốn thoát?</p><div class="row"><button class="btn d" data-act="tquit2">Thoát bài thi</button><button class="btn o" data-act="tstay" id="xmf">Ở lại làm bài</button></div></div>` : `<div class="card"><h2>Nộp bài?</h2><p>Đã làm <b>${n - un}/${n}</b> câu${un ? `, còn <b>${un}</b> câu chưa làm` : ""}${fl ? `, <b>${fl}</b> câu đang gắn cờ xem lại` : ""}. Sau khi nộp không thể sửa.</p><div class="row"><button class="btn" data-act="tsubmit2">Nộp bài</button><button class="btn o" data-act="tstay" id="xmf">Làm tiếp</button></div></div>`;
  document.body.append(d); const f = $("xmf"); if (f) f.focus();
}
function closeXm() { const d = $("xmdl"); if (d) d.remove(); }

function tresult() {
  const B = blocks(TK.qs), n = TK.qs.length;
  return `<h1>Kết quả: ${esc(TK.t)}</h1>${TK.name ? `<div class="mute">Học sinh: ${esc(TK.name)} (đã lưu vào bài giao)</div>` : TK.eid ? '<div class="mute small" style="color:var(--ok)">Kết quả thi thử đã được lưu vào lịch sử đề thi trên Firestore.</div>' : '<div class="mute small">Làm thử, kết quả không được lưu.</div>'}<div class="grid" style="margin:12px 0"><div class="card stat"><span>Điểm (thang 10)</span><b>${TK.sc}</b></div><div class="card stat"><span>Số câu đúng</span><b>${TK.cor}/${n}</b></div><div class="card stat"><span>Thời gian làm bài</span><b>${fmt(TK.used)}</b></div></div>
  <div class="card"><h2>Từng câu (bấm để xem lại)</h2><div class="row" style="gap:6px">${TK.qs.map((q, k) => `<button class="chip ${TK.ans[k] == null ? "" : TK.ans[k] === q.a ? "ok" : "bad"}" data-act="treview" data-n="${k}">${k + 1}</button>`).join("")}</div><div class="mute small" style="margin-top:6px">Xanh: đúng · Đỏ: sai · Không màu: bỏ trống</div></div>
  <div class="row"><button class="btn" data-act="treview">Xem lại bài và đáp án</button><button class="btn o" data-act="tclose">Đóng</button></div>`;

function loadJS(u) { return new Promise((res, rej) => { if (document.querySelector('script[src="' + u + '"]')) return res(); const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = () => rej(new Error("lib")); document.head.append(s); }); }

const normPh = v => { let d = String(v || "").replace(/[^\d+]/g, ""); if (/^\d{9}$/.test(d)) d = "0" + d; return d; };
function hdrMap(row) {
  const M = {}; row.forEach((h, i) => {
    const s = String(h || "").toLowerCase().normalize("NFC").trim(); if (!s) return;
    const ph = /phụ huynh|\bph\b|\bbố\b|\bmẹ\b/.test(s); let k = null; if (ph) return;
    if (/^mã\b|\bmã (học sinh|hs|số)|student id|^msv?\b|\bmhs\b/.test(s)) k = "code";
    else if (/ngày sinh|sinh nhật|dob/.test(s)) k = "dob";
    else if (/giới/.test(s)) k = "gender";
    else if (/điện thoại|sđt|sdt|phone/.test(s)) k = ph ? "pphone" : "phone";
    else if (/ghi chú|note/.test(s)) k = "note";
    else if (/họ/.test(s) && /tên/.test(s)) k = "name";
    else if (s == "tên" || /^tên học sinh/.test(s)) k = "name";
    if (k && !(k in M)) M[k] = i;
  });
  return M;
}

async function readClassFile() {
  const f = ($("cfile") || {}).files && $("cfile").files[0]; if (!f) return toast("Hãy chọn file Excel (.xlsx) trước.");
  try {
    if (!window.XLSX) await loadJS(XLS);
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array", cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const A = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "", dateNF: "dd/mm/yyyy" });
    let hi = -1, M = {};
    for (let i = 0; i < Math.min(A.length, 10); i++) { const m = hdrMap(A[i]); if ("name" in m) { hi = i; M = m; break; } }
    if (hi < 0) { IM = null; render(); return toast('Không tìm thấy cột "Họ và tên HS" ở dòng tiêu đề.'); }
    const rows = [], warn = [], seen = new Set();
    for (let i = hi + 1; i < A.length; i++) {
      const r = A[i], g = k => k in M ? String(r[M[k]] ?? "").trim() : "";
      const name = g("name").replace(/\s+/g, " "); if (!name) continue;
      if (seen.has(name.toLowerCase())) continue; seen.add(name.toLowerCase());
      let dob = g("dob");
      rows.push({ code: g("code"), name, dob, gender: g("gender"), phone: normPh(g("phone")), note: g("note") });
      if (rows.length >= 300) break;
    }
    IM = { f: f.name, rows, warn }; render();
  } catch (x) { IM = null; render(); toast("Không đọc được file Excel."); }
}

const mkCode = () => {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)];
  return S.a.some(a => a.code == c) ? mkCode() : c;
};

async function syncAssignmentToServer(a, e, c) {
  if (!ME || !a || !e) return;
  try {
    const token = await ME.getIdToken();
    await fetch("/api/teacher/assignments", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        assignment: a,
        exam: e,
        classInfo: c ? { id: c.id, name: c.n, students: c.st || [] } : null
      })
    });
  } catch (err) {
    console.warn("Could not sync assignment to server:", err);
  }
}

async function syncAssignmentSubmissions(code, showToast = false) {
  if (!ME || !code) return;
  try {
    const token = await ME.getIdToken();
    const resp = await fetch("/api/teacher/assignments/" + encodeURIComponent(code) + "/submissions", {
      headers: { "Authorization": "Bearer " + token }
    });
    if (resp.ok) {
      const data = await resp.json();
      const a = S.a.find(x => x.code === code);
      if (a && Array.isArray(data.subs)) {
        const prevCount = (a.subs || []).length;
        a.subs = data.subs;
        if (data.subs.length !== prevCount) {
          saveNow();
          render();
        }
        if (showToast) toast("Đã đồng bộ bài nộp: " + data.subs.length + " bài nộp từ học sinh.");
      }
    }
  } catch (e) {
    console.warn("syncAssignmentSubmissions error:", e);
  }
}

async function syncAllTeacherAssignments() {
  if (!ME || !S.a || S.a.length === 0) return;
  try {
    const token = await ME.getIdToken();
    const resp = await fetch("/api/teacher/sync-all", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        assignments: S.a,
        exams: S.e,
        classes: S.c
      })
    });
    if (resp.ok) {
      const data = await resp.json();
      if (data.submissionsByCode) {
        let changed = false;
        let newCount = 0;
        let latestStudent = "";
        let latestTitle = "";
        for (const a of S.a) {
          const remoteSubs = data.submissionsByCode[a.code];
          if (Array.isArray(remoteSubs) && remoteSubs.length > (a.subs || []).length) {
            const added = remoteSubs.slice((a.subs || []).length);
            newCount += added.length;
            if (added.length) {
              latestStudent = added[added.length - 1].name;
              latestTitle = a.title || ex(a.eid)?.title || "";
            }
            a.subs = remoteSubs;
            changed = true;
          }
        }
        if (changed) {
          saveNow();
          render();
          if (newCount > 0) {
            toast(`🔔 Có ${newCount} bài nộp mới từ ${latestStudent ? latestStudent + ' (' + latestTitle + ')' : 'học sinh'}!`);
            const b = document.querySelector(".bell");
            if (b) {
              b.classList.add("ring");
              setTimeout(() => b.classList.remove("ring"), 1200);
            }
          }
        }
      }
    }
  } catch (e) {
    console.warn("syncAllTeacherAssignments error:", e);
  }
}

function createAssign() {
  const e = ex(AS.sel);
  if (!e) return toast("Hãy chọn một đề.");
  const s = AS.s;
  const min = Math.max(1, Math.min(300, Math.round(+s.min || 0)));
  if (!min) return toast("Hãy nhập thời gian làm bài (phút).");

  const a = {
    id: uid(),
    eid: e.id,
    cid: s.cid || "",
    due: "",
    code: mkCode(),
    title: (s.title || "").trim() || e.title,
    set: {
      min,
      open: s.open || "",
      close: s.close || "",
      tries: String(s.tries ?? "1"),
      scale: +s.scale == 100 ? 100 : 10,
      pass: Math.max(0, Math.min(100, +s.pass || 0)),
      show: s.show === "no" ? "no" : "yes"
    },
    subs: [],
    at: Date.now()
  };

  S.a.push(a);
  saveNow();
  syncAssignmentToServer(a, e, cls(a.cid));

  AS = { sel: null, s: null };
  AD = a.id;
  toast("Đã tạo bài giao thành công! Mã làm bài: " + a.code);
  go("asgd");
}

function start(){ const n = $("nm").value.trim(); if (!n) return alert("Vui lòng nhập họ và tên!"); ST.name = n; ST.cls = $("cl").value.trim(); ST.phase = "taking"; ST.t0 = Date.now(); ST.end = Date.now() + DATA.min*60000; ST.tm = setInterval(tick, 1000); render(); }

function doImportResultCode() {
  const el = $("import_code_txt");
  let val = (el ? el.value : "").trim();
  if (!val) return toast("Vui lòng dán mã kết quả!");
  if (val.startsWith("BLINGO:")) val = val.slice(7);

  try {
    const raw = decodeURIComponent(escape(atob(val)));
    const item = JSON.parse(raw);
    if (!item.name || typeof item.sc !== "number") throw new Error("bad format");

    const a = S.a.find(x => x.id == AD);
    if (!a) return toast("Không tìm thấy bài giao.");

    a.subs = a.subs || [];
    a.subs.push({
      id: "offline_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      name: item.name,
      className: item.className || "",
      studentCode: item.studentCode || "",
      sc: item.sc,
      cor: item.cor,
      n: item.n,
      scale: a.set?.scale || 10,
      at: item.at || Date.now(),
      used: item.used || 0,
      ans: item.ans || []
    });

    saveNow();
    closeXm();
    toast(`Đã nhập kết quả của học sinh "${item.name}" thành công (${item.cor}/${item.n} câu đúng)!`);
    render();

    if (a.code) {
      syncAssignmentToServer(a, ex(a.eid), cls(a.cid));
    }
  } catch (e) {
    toast("Mã kết quả không hợp lệ hoặc bị lỗi cú pháp.");
  }
}

let STU = {
  phase: "entry", // "entry" | "taking" | "result" | "review"
  code: "",
  loading: false,
  err: "",
  info: null,
  sessionToken: null,
  exam: null, // Sanitized questions from server: NO ANSWERS, NO EXPLANATIONS
  name: "",
  className: "",
  studentCode: "",
  ans: [],
  fl: [],
  i: 0,
  startedAt: 0,
  end: 0,
  w5: 0,
  w1: 0,
  timer: null,
  result: null
};

function isStudentPath() {
  return window.location.pathname.startsWith("/lam-bai");
}

function getStudentCode() {
  const p = window.location.pathname;
  if (!p.startsWith("/lam-bai")) return "";
  const parts = p.split("/lam-bai/")[1]?.split("/")[0]?.split("?")[0]?.trim();
  return (parts || "").toUpperCase();
}

async function loadStudentExamInfo(code) {
  if (!code) {
    STU.err = "Không tìm thấy mã bài thi trên đường dẫn liên kết.";
    return render();
  }
  STU.code = code;
  STU.loading = true;
  STU.err = "";
  render();

  try {
    const resp = await fetch("/api/bai/" + encodeURIComponent(code) + "/thong-tin");
    if (!resp.ok) {
      const j = await resp.json().catch(() => ({}));
      throw new Error(j.error || "Không tìm thấy bài thi.");
    }
    const info = await resp.json();
    STU.info = info;
    STU.loading = false;
    STU.phase = "entry";
  } catch (err) {
    STU.loading = false;
    STU.err = err.message || "Lỗi tải thông tin bài thi.";
  }
  render();
}

function startStudentTimer() {
  clearInterval(STU.timer);
  STU.w5 = 0; STU.w1 = 0;
  STU.timer = setInterval(studentTick, 1000);
}

function studentTick() {
  if (STU.phase !== "taking") {
    clearInterval(STU.timer);
    return;
  }
  const remain = Math.max(0, STU.end - Date.now());
  const el = $("tm");
  if (el) {
    el.textContent = fmt(remain);
    el.classList.toggle("low", remain <= 300000);
  }
  if (remain <= 300000 && remain > 0 && !STU.w5) {
    STU.w5 = 1;
    toast("Còn 5 phút nữa là hết giờ làm bài!");
  }
  if (remain <= 60000 && remain > 0 && !STU.w1) {
    STU.w1 = 1;
    toast("Còn 1 phút! Hệ thống sẽ tự động nộp bài khi hết giờ.");
  }
  if (remain <= 0) {
    clearInterval(STU.timer);
    toast("Đã hết giờ làm bài! Đang tự động nộp bài lên máy chủ...");
    studentSubmitExam();
  }
}

async function studentStartExam() {
  const nameInput = $("stu_name");
  const name = (nameInput ? nameInput.value : STU.name).trim();
  if (!name) {
    return toast("Vui lòng nhập họ và tên của bạn trước khi bắt đầu làm bài.");
  }
  STU.name = name;
  const classInput = $("stu_class");
  if (classInput) STU.className = classInput.value.trim();
  const codeInput = $("stu_code");
  if (codeInput) STU.studentCode = codeInput.value.trim();

  STU.loading = true;
  render();

  try {
    const resp = await fetch("/api/bai/" + encodeURIComponent(STU.code) + "/bat-dau", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: STU.name,
        className: STU.className,
        studentCode: STU.studentCode
      })
    });

    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.error || "Không thể bắt đầu làm bài.");
    }

    STU.loading = false;
    STU.sessionToken = data.sessionToken;
    STU.exam = {
      title: data.title,
      min: data.min,
      scale: data.scale,
      pass: data.pass,
      qs: data.questions
    };
    STU.ans = Array(data.questions.length).fill(null);
    STU.fl = Array(data.questions.length).fill(0);
    STU.i = 0;
    STU.startedAt = data.startedAt;
    STU.end = data.expiresAt;
    STU.phase = "taking";
    startStudentTimer();
  } catch (err) {
    STU.loading = false;
    toast(err.message || "Lỗi khi bắt đầu làm bài.");
  }
  render();
}

function spSay(t) { try { if (!SP.tts || !window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-GB"; u.rate = .95; speechSynthesis.speak(u); } catch (e) {} }
function spRecStop() { SP.want = 0; if (SP.t0) { SP.sec += (Date.now() - SP.t0) / 1000; SP.t0 = 0; } const r = SP.rec; SP.rec = null; try { r && r.stop(); } catch (e) {} }

function spAsk(pre) {
  const q = SP.qs[SP.i]; SP.cur = ""; SP.fin = ""; SP.sec = 0; SP.t0 = 0; SP.mic = 0; SP.qt0 = Date.now(); SP.prep = q.cue ? 1 : 0;

async function spStart(c) {
  if (!hasAiAccess()) return toast("Vui lòng đăng nhập để sử dụng tính năng luyện nói với AI.");
  SP.cfg = c;
  const p = `Bạn là giám khảo Speaking. Tạo bộ câu hỏi luyện nói tiếng Anh cho học sinh THPT Việt Nam, trình độ ${c.lv}. Chủ đề: ${c.topic || "cuộc sống hàng ngày và công nghệ"}.\nCấu trúc: 3 câu Part 1, 1 thẻ Part 2 (part=2, "cue" là mảng 4 dòng gợi ý), 3 câu Part 3.\nChỉ trả về JSON thuần: {"intro":"Welcome to the speaking test.","qs":[{"part":1,"q":"..."},{"part":2,"q":"Describe...","cue":["You should say:","...","...","..."]},{"part":3,"q":"..."}]}`;
  SP.ph = "gen"; render();
  try {
    const r = await viaGemini(p);
    const j = JSON.parse(r.text.replace(/```json|```/g, "").trim());
    SP.qs = j.qs || []; SP.i = 0; SP.ans = []; SP.fb = null; SP.ph = "ask";
    spAsk((j.intro || "Good afternoon.") + " ");

}

  return `<div class="tabs" style="display:inline-flex;flex-wrap:wrap;margin-bottom:8px">${[["wiz", "✨ Theo SGK Global Success (AI)"], ["manual", "Soạn tay"], ["ai", "Chủ đề tự do (AI)"], ["lesson", "Nội dung bài học (AI)"], ["scan", "Số hóa file"]].map(([k, l]) => `<button data-act="mode" data-m="${k}" aria-pressed="${m == k}">${l}</button>`).join("")}</div>`;
}

function wizV() {
  const gs = GSU[W.grade] || GSU["12"];
  const uName = (gs[+W.unit - 1] || gs[0])[0];
  const fmtCfg = FMT[W.fmt] || FMT.kttx;
  if (W.ph == "run") {
    return `<h1>Tạo đề</h1><div class="card"><b>Đang biên soạn đề thi bằng AI</b><div class="mute small">Unit ${W.unit} · ${uName} · ${fmtCfg.name}</div><ol class="stp"><li class="${W.step > 0 ? "done" : "cur"}"><span class="dot">1</span>Khởi tạo bài đọc &amp; ngữ liệu</li><li class="${W.step > 1 ? "done" : W.step == 1 ? "cur" : ""}"><span class="dot">2</span>Biên soạn ${fmtCfg.qs} câu hỏi trắc nghiệm chuẩn</li></ol><div class="small mute">${esc(W.sub)}</div></div>`;
  }
  if (W.ph == "prev" && W.exam) {
    return `<h1>Tạo đề</h1><div class="card"><label>Tên đề</label><input id="wz_ti" value="${esc(W.title)}"><div class="row" style="margin:10px 0"><span class="tag b">${W.exam.qs.length} câu</span><span class="tag w">AI tạo (${fmtCfg.name.split(" – ")[0]})</span></div><div class="row"><button class="btn" data-act="wzSave">Lưu vào Kho đề</button><button class="btn o" data-act="wzTry">Làm thử đề này</button><button class="btn o" data-act="wzNew">Tạo đề khác</button></div></div>`;
  }
  return `<h1>Tạo đề</h1><div class="card"><h2>Cấu hình tạo đề theo SGK Global Success</h2>
  <div class="grid">
    <div><label>Khối lớp</label><select id="wz_g" data-w="grade">${["10", "11", "12"].map(g => `<option value="${g}" ${W.grade == g ? "selected" : ""}>Lớp ${g}</option>`).join("")}</select></div>
    <div><label>Unit</label><select id="wz_u" data-w="unit">${gs.map((u, i) => `<option value="${i + 1}" ${W.unit == i + 1 ? "selected" : ""}>Unit ${i + 1} – ${u[0]}</option>`).join("")}</select></div>
    <div><label>Định dạng đề</label><select id="wz_fmt" data-w="fmt">${Object.entries(FMT).map(([k, f]) => `<option value="${k}" ${W.fmt == k ? "selected" : ""}>${f.name}</option>`).join("")}</select></div>
  </div>
  <div style="margin-top:14px"><button class="btn" data-act="wzGo">Bắt đầu tạo đề bằng AI</button></div></div>`;

async function wRun() {
  if (!hasAiAccess()) return toast("Vui lòng đăng nhập để sử dụng tính năng tạo đề bằng AI.");
  const gs = GSU[W.grade] || GSU["12"];
  const uName = (gs[+W.unit - 1] || gs[0])[0];
  const fmtCfg = FMT[W.fmt] || FMT.kttx;
  const numQ = fmtCfg.qs || 25;
  W.ph = "run"; W.step = 0; W.sub = "Đang soạn bài đọc & ngữ liệu..."; render();

  try {
    const p1 = `Bạn là giáo viên tiếng Anh THPT. Soạn 1 bài đọc ngắn 150-200 từ chủ đề: Global Success lớp ${W.grade}, Unit ${W.unit}: ${uName}. Trả về JSON thuần: {"text":"nội dung bài đọc tiếng Anh"}`;
    const r1 = await viaGemini(p1);
    const j1 = JSON.parse(r1.text.replace(/```json|```/g, "").trim());
    W.step = 1; W.sub = `Đang biên soạn ${numQ} câu hỏi trắc nghiệm chuẩn ${fmtCfg.name}...`; render();

    const p2 = `Dựa vào chủ đề Global Success lớp ${W.grade}, Unit ${W.unit}: ${uName} và bài đọc sau:\n"""\n${j1.text}\n"""\nHãy biên soạn đúng ${numQ} câu hỏi trắc nghiệm tiếng Anh cho học sinh THPT, trình độ B1-B2. Cấu trúc bài kiểm tra gồm các câu đọc hiểu (đáp án dựa theo bài đọc với p là trích đoạn bài đọc), ngữ âm (phát âm, trọng âm), từ vựng & ngữ pháp của Unit, chức năng giao tiếp.\nMỗi câu có 4 đáp án A, B, C, D và chỉ MỘT đáp án đúng (chỉ số a từ 0 đến 3), kèm lời giải thích ngắn gọn (ex).\nTrả về JSON thuần danh sách các câu hỏi:\n[{"p":"${j1.text.slice(0, 150)}...","q":"câu hỏi trắc nghiệm","o":["lựa chọn A","lựa chọn B","lựa chọn C","lựa chọn D"],"a":0,"ex":"giải thích ngắn gọn"}]`;
    const r2 = await viaGemini(p2);
    let qs = JSON.parse(r2.text.replace(/```json|```/g, "").trim());
    if (!Array.isArray(qs)) {
      if (qs.qs && Array.isArray(qs.qs)) qs = qs.qs;
      else if (qs.questions && Array.isArray(qs.questions)) qs = qs.questions;
    }
    W.exam = { qs };
    W.title = `Đề ${W.fmt == "kttx" ? "KTTX (25 câu)" : W.fmt == "ktdk" ? "KTĐK (32 câu)" : "thi thử THPT 40 câu"} – Global Success ${W.grade} – Unit ${W.unit}: ${uName}`;
    W.ph = "prev";
    render();
  } catch (x) {
    console.error(x);
    W.ph = "form"; toast("Lỗi tạo đề: " + (x.detail || x.message || "")); render();
  }
}

async function ensureUnitPlan(g, u, uName) {
  if (!S.tpp) S.tpp = {};
  const key = `${g}-${u}`;
  if (Array.isArray(S.tpp[key]) && S.tpp[key].length === 10) {
    return S.tpp[key];
  }
  const pre = DEFAULT_UNIT_PLANS[g]?.[u];
  const plan = (pre && pre.length === 10) ? [...pre] : generateFallbackPlan(g, u, uName);
  S.tpp[key] = plan;
  await saveNow(); // Lưu kế hoạch 10 test vào Firestore ngay lập tức
  return plan;
}

function parseQuestionsFromAi(raw) {
  let text = String(raw || "").trim();
  text = text.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/i, "").trim();
  
  // 1. Thử parse trực tiếp JSON
  try {
    const direct = JSON.parse(text);
    if (Array.isArray(direct)) return sanitizeQuestions(direct);
    if (direct.qs && Array.isArray(direct.qs)) return sanitizeQuestions(direct.qs);
    if (direct.questions && Array.isArray(direct.questions)) return sanitizeQuestions(direct.questions);
    if (direct.tests && Array.isArray(direct.tests)) return sanitizeQuestions(direct.tests);
  } catch (e) {}

  // 2. Thử trích xuất mảng [...]
  const firstBracket = text.indexOf('[');
  const lastBracket = text.lastIndexOf(']');
  if (firstBracket !== -1 && lastBracket > firstBracket) {
    try {
      const parsed = JSON.parse(text.slice(firstBracket, lastBracket + 1));
      if (Array.isArray(parsed)) return sanitizeQuestions(parsed);
    } catch(e) {}
  }

  // 3. Thử trích xuất đối tượng {...}
  const firstBrace = text.indexOf('{');
  const lastBrace = text.lastIndexOf('}');
  if (firstBrace !== -1 && lastBrace > firstBrace) {
    try {
      const parsed = JSON.parse(text.slice(firstBrace, lastBrace + 1));
      if (parsed.qs && Array.isArray(parsed.qs)) return sanitizeQuestions(parsed.qs);
      if (parsed.questions && Array.isArray(parsed.questions)) return sanitizeQuestions(parsed.questions);
    } catch(e) {}
  }

  console.error("Lỗi phân tích JSON câu hỏi từ AI:", text.slice(0, 300));
  return null;
}

function sanitizeQuestions(qs) {
  return qs.map((q, idx) => {
    let opts = Array.isArray(q.o) ? q.o.map(x => String(x ?? "").trim()) : [];
    while (opts.length < 4) opts.push("Lựa chọn " + "ABCD"[opts.length]);
    if (opts.length > 4) opts = opts.slice(0, 4);
    let a = typeof q.a === "number" ? q.a : parseInt(q.a, 10);
    if (isNaN(a) || a < 0 || a > 3) {
      if (typeof q.a === "string" && /^[A-D]$/i.test(q.a.trim())) {
        a = "ABCD".indexOf(q.a.trim().toUpperCase());
      } else {
        a = 0;
      }
    }
    return {
      p: q.p ? String(q.p).trim() : "",
      q: String(q.q || `Câu hỏi ${idx + 1}`).trim(),
      o: opts,
      a: a,
      ex: q.ex ? String(q.ex).trim() : ""
    };
  });
}

async function createSingleThptTest(g, u, n) {
  if (!hasAiAccess()) return toast("Vui lòng đăng nhập để sử dụng tính năng tạo đề bằng AI.");
  const gs = GSU[g] || GSU["12"];
  const uName = (gs[u - 1] || gs[0])[0];
  const plan = await ensureUnitPlan(g, u, uName);
  const subtheme = (plan && plan[n - 1]) || `Chủ đề phần ${n} của Unit ${u}`;

  TG.err = "";
  TG.stop = false;
  TG.run = { g, u, n, sub: `Đang biên soạn Test ${n}: "${subtheme}" theo chuẩn THPT 2025...` };
  render();

  try {
    const prompt = buildThptPrompt(g, u, uName, n, subtheme);
    const res = await viaGemini(prompt);
    let qs = parseQuestionsFromAi(res.text);
    if (!Array.isArray(qs) || qs.length < 10) {
      throw new Error("Không nhận diện được cấu trúc câu hỏi từ AI. Vui lòng thử lại.");
    }

    // Bảo lưu lịch sử thi thử và ID nếu là tạo lại (tpRe)
    const oldExam = S.e.find(x => x.tp && x.tp.g == g && x.tp.u == u && x.tp.n == n);
    const tries = oldExam && Array.isArray(oldExam.tries) ? oldExam.tries : [];
    const examId = oldExam ? oldExam.id : uid();

    S.e = S.e.filter(x => !(x.tp && x.tp.g == g && x.tp.u == u && x.tp.n == n));
    const newExam = {
      id: examId,
      title: `Đề thi thử THPT Lớp ${g} – Unit ${u}: ${uName} – Test ${n}`,
      qs: qs,
      src: "ai",
      g: String(g),
      un: String(u),
      ty: "thpt",
      tp: { g: String(g), u: Number(u), n: Number(n) },
      tries: tries,
      ts: Date.now(),
      ownerUid: ME ? ME.uid : "",
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    S.e.push(newExam);
    if (ME) {
      try {
        await setDoc(doc(db, "exams", examId), newExam);
      } catch (err) {
        console.error("Firestore exam write error:", err);
      }
    }
    await saveNow();
    TG.run = null;
    toast(`Đã tạo thành công Test ${n} cho Unit ${u}!`);
    render();
  } catch (err) {
    console.error(err);
    TG.run = null;
    TG.err = `Lỗi tạo Test ${n}: ${err.detail || err.message || ""}`;
    toast(`Lỗi khi tạo Test ${n}: ${err.detail || err.message || ""}`);
    render();
  }
}

async function handleImportExamsFile(file) {
  if (!file) return;
  if (!ME || !ME.uid) {
    toast("Vui lòng đăng nhập tài khoản giáo viên trước khi nhập kho đề.");
    document.body.classList.add("locked");
    return render();
  }

  const reader = new FileReader();
  reader.onerror = () => toast("Lỗi khi đọc file trên trình duyệt.");
  reader.onload = async (evt) => {
    try {
      const content = evt.target.result;
      let data;
      try {
        data = JSON.parse(content);
      } catch (parseErr) {
        toast("File JSON không hợp lệ hoặc bị lỗi cú pháp: " + parseErr.message);
        return;
      }
      await processImportExamsJson(data);
    } catch (err) {
      console.error("Import error:", err);
      hideImportModal();
      toast("Lỗi xử lý file đề: " + (err.message || err));
    }
  };
  reader.readAsText(file, "UTF-8");
}

async function processImportExamsJson(data) {
  if (!data || typeof data !== "object") {
    toast("Nội dung file JSON không hợp lệ.");
    return;
  }

  const examsList = Array.isArray(data.exams) ? data.exams : (Array.isArray(data) ? data : []);
  if (!examsList.length) {
    toast("File JSON không chứa danh sách đề thi hợp lệ ('exams' trống).");
    return;
  }

  renderImportModal({
    total: examsList.length,
    current: 0,
    batchIdx: 0,
    totalBatches: 1,
    pct: 0,
    status: "Đang kiểm tra các đề đã có trong kho Firestore..."
  });

  // 1. Fetch existing exam IDs for this owner to skip duplicates
  const existingSet = new Set();
  try {
    const snap = await getDocs(query(collection(db, "exams"), where("ownerUid", "==", ME.uid)));
    snap.forEach(d => existingSet.add(String(d.id)));
  } catch (err) {
    console.warn("Could not query Firestore exams for check, using memory fallback:", err);
  }
  (S.e || []).forEach(x => { if (x.id) existingSet.add(String(x.id)); });

  // 2. Filter out already existing IDs
  const toImport = [];
  let skippedCount = 0;
  const seenInFile = new Set();

  for (const item of examsList) {
    if (!item || item.id == null) continue;
    const strId = String(item.id);
    if (existingSet.has(strId) || seenInFile.has(strId)) {
      skippedCount++;
      continue;
    }
    seenInFile.add(strId);
    toImport.push(item);
  }

  if (toImport.length === 0) {
    hideImportModal();
    toast(`Đã kiểm tra ${examsList.length} đề: Toàn bộ ${skippedCount} đề đã có trong kho (đã bỏ qua).`, 5500);
    return;
  }

  // 3. Batch write up to 400 documents per batch
  const BATCH_SIZE = 400;
  const batches = [];
  for (let i = 0; i < toImport.length; i += BATCH_SIZE) {
    batches.push(toImport.slice(i, i + BATCH_SIZE));
  }
  const totalBatches = batches.length;
  let savedCount = 0;

  for (let bIdx = 0; bIdx < totalBatches; bIdx++) {
    const chunk = batches[bIdx];
    const batch = writeBatch(db);

    renderImportModal({
      total: toImport.length,
      current: savedCount,
      batchIdx: bIdx + 1,
      totalBatches,
      pct: Math.round((savedCount / toImport.length) * 100),
      status: `Đang ghi lô ${bIdx + 1}/${totalBatches} (${chunk.length} đề) vào Firestore...`
    });

    for (const rawEx of chunk) {
      const exId = String(rawEx.id);
      const docRef = doc(db, "exams", exId);
      const examDoc = {
        id: exId,
        title: rawEx.title || `Đề thi ${exId}`,
        qs: Array.isArray(rawEx.qs) ? rawEx.qs : [],
        g: String(rawEx.g || (rawEx.tp && rawEx.tp.g) || "12"),
        ty: String(rawEx.ty || "thpt"),
        un: String(rawEx.un || (rawEx.tp && rawEx.tp.u ? rawEx.tp.u : "")),
        ts: typeof rawEx.ts === "number" ? rawEx.ts : Date.now(),
        src: rawEx.src || "kho-de",
        tp: rawEx.tp ? {
          g: String(rawEx.tp.g || rawEx.g || "12"),
          u: Number(rawEx.tp.u || rawEx.un || 1),
          n: Number(rawEx.tp.n || 1)
        } : null,
        tries: Array.isArray(rawEx.tries) ? rawEx.tries : [],
        ownerUid: ME.uid,
        createdAt: typeof rawEx.ts === "number" ? rawEx.ts : Date.now(),
        updatedAt: Date.now()
      };
      batch.set(docRef, examDoc);
    }

    await batch.commit();
    savedCount += chunk.length;

    renderImportModal({
      total: toImport.length,
      current: savedCount,
      batchIdx: bIdx + 1,
      totalBatches,
      pct: Math.round((savedCount / toImport.length) * 100),
      status: `Đã lưu thành công lô ${bIdx + 1}/${totalBatches} (${savedCount}/${toImport.length} đề)...`
    });

    await new Promise(r => setTimeout(r, 60));
  }

  // 4. Update unit plans (tpp) if present
  if (data.tpp && typeof data.tpp === "object" && Object.keys(data.tpp).length > 0) {
    S.tpp = { ...(S.tpp || {}), ...data.tpp };
    try {
      await setDoc(doc(db, "users", ME.uid), { tpp: S.tpp, updatedAt: Date.now() }, { merge: true });
    } catch (tppErr) {
      console.warn("Could not save tpp plan:", tppErr);
    }
  }

  hideImportModal();
  toast(`Nhập thành công ${savedCount} đề thi vào Firestore! (Bỏ qua ${skippedCount} đề đã có sẵn).`, 6000);
  await loadExamsFromFirestore();
  render();
}

    return go("takeStart");
  }
  if (A == "addT") { const x = val("tk").trim(); if (!x) return toast("Nhập việc cần làm."); S.t.push({ id: uid(), x, due: val("td"), done: 0 }); save(); return render(); }
  if (A == "delT") { S.t = S.t.filter(t => t.id != D.id); save(); return render(); }
  if (A == "chk") { const t = S.t.find(t => t.id == D.id); if (t) { t.done = t.done ? 0 : 1; save(); render(); } return; }
  if (A == "spGo") return spStart(SP.cfg);
  if (A == "spHear") { spSay(SP.qs[SP.i].q); return; }
  if (A == "spNext") { const t = val("sp_ans").trim(); SP.ans.push({ part: SP.qs[SP.i].part, q: SP.qs[SP.i].q, t }); if (SP.i + 1 < SP.qs.length) { SP.i++; return spAsk(); } toast("Hoàn thành bài luyện nói!"); SP.ph = "setup"; return render(); }
  if (A == "spSkip") { if (SP.i + 1 < SP.qs.length) { SP.i++; return spAsk(); } SP.ph = "setup"; return render(); }
  if (A == "spQuit") { spLeave(); SP.ph = "setup"; return render(); }
  if (A == "bkDel") { 
    S.e = S.e.filter(x => x.id != D.id); 
    if (ME) {
      deleteDoc(doc(db, "exams", D.id)).catch(err => console.error("Firestore delete error:", err));
    }
    save(); 
    toast("Đã xóa đề."); 
    return render(); 
  }
  if (A == "bkExportJson") {
    if (!S.e.length) return toast("Kho đề hiện đang trống.");
    const exportData = {
      blingo: "kho-de",
      version: "1.0",
      exportedAt: Date.now(),
      count: S.e.length,
      exams: S.e,
      tpp: S.tpp || {}
    };
    const jsonStr = JSON.stringify(exportData, null, 2);
    const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `kho-de-blingo-${today()}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast(`Đã xuất ${S.e.length} đề thi ra file JSON.`);
    return;
  }
  if (A == "openTerms") { TERMS_OPEN = true; return render(); }
  if (A == "closeTerms") { TERMS_OPEN = false; return render(); }
});

document.addEventListener("change", e => {
  if (e.target.id == "bk_import_input" || e.target.id == "bk_import_input_empty") {
    const file = e.target.files && e.target.files[0];
    if (file) {
      handleImportExamsFile(file);
      e.target.value = "";
    }
    return;
  }
  if (e.target.id == "rep_asg_select") { REP.asgId = e.target.value; return render(); }
  if (e.target.id == "rep_cls_select") { REP.clsId = e.target.value; return render(); }
  if (e.target.id == "vsel") { VW.i = +e.target.value; return render(); }
  if (e.target.id == "vans") { VW.ans = e.target.checked; return render(); }
  if (e.target.dataset.w) { W[e.target.dataset.w] = e.target.value; return render(); }
  if (e.target.dataset.as && AS.s) { AS.s[e.target.dataset.as] = e.target.value; }
  if (e.target.id == "stu_sel") {
    const opt = e.target.selectedOptions && e.target.selectedOptions[0];
    if (opt && opt.value) {
      STU.name = opt.value;
      if (opt.dataset.code) STU.studentCode = opt.dataset.code;
      const ni = $("stu_name"); if (ni) ni.value = STU.name;
      const ci = $("stu_code"); if (ci && opt.dataset.code) ci.value = opt.dataset.code;
    }
  }
});

document.addEventListener("input", e => {
  if (e.target.id == "sp_ans") SP.cur = e.target.value;
  if (e.target.dataset.cf) CF[e.target.dataset.cf] = e.target.value;
  if (e.target.dataset.as && AS.s) AS.s[e.target.dataset.as] = e.target.value;
  if (e.target.dataset.m) E[e.target.dataset.m] = e.target.value;
  if (e.target.id == "bk_q") { BK.q = e.target.value; render(); }
  if (e.target.id == "stu_name") STU.name = e.target.value;
  if (e.target.id == "stu_class") STU.className = e.target.value;
  if (e.target.id == "stu_code") STU.studentCode = e.target.value;
});

/* Initialize */
render();
</script>
</body>
</html>
